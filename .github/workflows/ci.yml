name: CI

on:
  push:
  pull_request:

jobs:
  fallback-real-1-13:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install fallback test dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq openssl iproute2 python3
      - name: Download verified sing-box 1.13.18
        shell: bash
        run: |
          set -Eeuo pipefail
          version=1.13.18
          case "$(uname -m)" in
            x86_64) arch=amd64; expected=d34d987ed6ae39ca3760269264fb502b867e5477db45518c829b07776245c495 ;;
            aarch64) arch=arm64; expected=a894f6152cade4a2c9d062762d54dea0c1aee673ab4759e0829e19cace932719 ;;
            *) printf 'unsupported runner architecture: %s\n' "$(uname -m)" >&2; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/sing-box-$version-linux-$arch.tar.gz"
          install_dir="$RUNNER_TEMP/sing-box-$version"
          curl -fsSL --connect-timeout 10 --max-time 120 \
            "https://github.com/SagerNet/sing-box/releases/download/v$version/sing-box-$version-linux-$arch.tar.gz" \
            -o "$archive"
          printf '%s  %s\n' "$expected" "$archive" | sha256sum -c -
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1
          real_bin="$install_dir/sing-box"
          "$real_bin" version | grep -F "sing-box version $version"
          printf 'SBCTL_REAL_SING_BOX_BIN=%s\n' "$real_bin" >>"$GITHUB_ENV"
          printf 'SBCTL_EXPECT_SING_BOX_SERIES=1.13\n' >>"$GITHUB_ENV"
      - name: Real 1.13 fallback config check
        run: bash tests/outbound-domain.sh
      - name: Real 1.13 TCP Happy Eyeballs fallback
        run: sudo --preserve-env=SBCTL_REAL_SING_BOX_BIN,SBCTL_EXPECT_SING_BOX_SERIES bash tests/outbound-fallback-tcp.sh

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq openssl ripgrep shellcheck
      - name: Static validation
        run: |
          bash scripts/build.sh
          git diff --exit-code -- dist/sbctl
          bash scripts/lint.sh
          bash scripts/test.sh
      - name: Install current stable sing-box
        run: curl -fsSL --connect-timeout 10 --max-time 60 https://sing-box.app/install.sh | sudo sh
      - name: Run smoke tests
        env:
          TERM: xterm
          SBCTL_TESTING: "1"
        run: |
          bash tests/no-firewall.sh
          bash tests/ui.sh
          bash tests/protocol-surface.sh
          bash tests/smoke-current.sh
          bash tests/outbound.sh
          bash tests/legacy-config.sh
          bash tests/reality-share.sh
          bash tests/hy2-hop.sh
          bash tests/lifecycle.sh
          bash tests/cloudflare.sh
          bash tests/maturity.sh
      - name: Alpine/OpenRC compatibility tests
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.21 sh -ec '
            apk add --no-cache bash curl jq openssl coreutils ripgrep >/dev/null
            export TERM=xterm SBCTL_TESTING=1
            bash scripts/build.sh
            bash -n sbctl.sh src/*.sh src/*/*.sh tests/*.sh tests/*/*.sh dist/sbctl
            sh -n alpine/install.sh
            bash tests/lifecycle.sh
            bash tests/cloudflare.sh
            bash tests/maturity.sh
            bash tests/alpine-release-real.sh
          '
